name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  security-events: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write VERSION from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          test -s VERSION
          test "$(cat VERSION)" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate JavaScript
        run: npm run check

      - name: Validate shell scripts
        run: sh -n scripts/start.sh scripts/deploy.sh

      - name: Validate Docker Compose config
        run: |
          cp .env.example .env
          docker compose config

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write VERSION from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          test -s VERSION
          test "$(cat VERSION)" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate --omit=dev

  codeql:
    name: CodeQL Code Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write VERSION from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          test -s VERSION
          test "$(cat VERSION)" = "$VERSION"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - ci
      - dependency-audit
      - codeql

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write VERSION from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          test -s VERSION
          test "$(cat VERSION)" = "$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: VERSION

  docker:
    name: Build and Push Docker Hub Image
    runs-on: ubuntu-latest
    needs:
      - ci
      - dependency-audit
      - codeql
      - release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write VERSION from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          test -s VERSION
          test "$(cat VERSION)" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Resolve Docker image
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          if [ -n "$DOCKERHUB_REPOSITORY" ]; then
            echo "image=$DOCKERHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          else
            echo "image=${DOCKERHUB_USERNAME}/zo2api" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=zo2api
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.ref.name=${{ steps.version.outputs.source_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            SOURCE_TAG=${{ steps.version.outputs.source_tag }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.image.outputs.image }}
          readme-filepath: ./DOCKER.md
          short-description: Zo Computer API proxy with OpenAI and Anthropic compatible endpoints.
