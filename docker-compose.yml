services:
  zo2api-01:
    build:
      context: .
      dockerfile: Dockerfile
    image: shyurongli/zo2api:latest
    container_name: zo2api-01
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    networks:
      - zo2api-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:' + (process.env.PORT || 8000) + '/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  zo2api-02:
    build:
      context: .
      dockerfile: Dockerfile
    image: shyurongli/zo2api:latest
    container_name: zo2api-02
    restart: unless-stopped
    environment:
      - ZO_ACCESS_TOKEN=zo_sk_你的token
      - PROXY_API_KEY=sk-proxy-gateway-v1
      - PROXY_PROMPT_OVERRIDE=true
      - PROXY_OUTPUT_SANITIZE=false
    ports:
      - 8001:8001
    networks:
      - zo2api-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:' + (process.env.PORT || 8000) + '/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


# =============================================================================
# Networks
# =============================================================================
networks:
  zo2api-network:
    driver: bridge